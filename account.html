{% extends "layout.html" %}

{% block content %}
<div style="background-color: #f5f5f7; min-height: 85vh; padding: 60px 20px; font-family: -apple-system, sans-serif;">
    <div style="max-width: 800px; margin: 0 auto; background: white; padding: 50px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center;">
        
        <div style="width: 100px; height: 100px; background: #e8e8ed; color: #1d1d1f; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 600; margin: 0 auto 20px;">
            {{ username[0] | upper }}
        </div>

        <h1 style="font-size: 48px; font-weight: 600; color: #1d1d1f; margin-bottom: 10px;">Welcome, {{ username }}!</h1>
        <p style="font-size: 19px; color: #6e6e73; margin-bottom: 40px;">Manage your account, view orders, and more.</p>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px;">
            <a href="/products" style="text-decoration: none; background: #f5f5f7; padding: 25px; border-radius: 18px; transition: 0.3s; border: 1px solid transparent;">
                <div style="font-size: 24px; margin-bottom: 10px;">🛒</div>
                <h3 style="color: #1d1d1f; margin: 0;">Start Shopping</h3>
                <p style="color: #6e6e73; font-size: 14px; margin-top: 5px;">Explore our latest tech collection.</p>
            </a>

            <div style="background: #f5f5f7; padding: 25px; border-radius: 18px; border: 1px solid transparent;">
                <div style="font-size: 24px; margin-bottom: 10px;">📦</div>
                <h3 style="color: #1d1d1f; margin: 0;">Your Orders</h3>
                <p style="color: #6e6e73; font-size: 14px; margin-top: 5px;">Track your deliveries and history.</p>
            </div>
        </div>

        <hr style="margin: 40px 0; border: 0; border-top: 1px solid #d2d2d7;">
        
        <div style="display: flex; justify-content: center; gap: 30px; align-items: center;">
            <a href="/logout" style="color: #ff3b30; text-decoration: none; font-weight: 500; font-size: 17px;">Sign Out</a>
            <span style="color: #d2d2d7;">|</span>
            <a href="/" style="color: #0071e3; text-decoration: none; font-weight: 500; font-size: 17px;">Return Home</a>
        </div>
    </div>
</div>

<style>
    a:hover {
        border-color: #d2d2d7 !important;
        transform: translateY(-2px);
    }
</style>
{% endblock %}
