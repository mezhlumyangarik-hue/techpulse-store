{% extends "layout.html" %}
{% block content %}
<div style="max-width: 800px; margin: 60px auto; padding: 20px;">
    <div style="margin-bottom: 30px;">
        <h1 style="font-size: 38px;">Review your bag.</h1>
    </div>

    {% for item in cart %}
    <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #d2d2d7; padding: 25px 0;">
        <div style="display: flex; align-items: center; gap: 25px;">
            <img src="/static/uploads/{{ item.img }}" style="width: 100px; height: 100px; object-fit: contain;">
            <div>
                <h3 style="margin: 0;">{{ item.name }}</h3>
                <p style="color: #0071e3; font-weight: 600; margin-top: 5px;">${{ item.price }}</p>
            </div>
        </div>
        <a href="/remove_from_cart/{{ loop.index0 }}" style="text-decoration: none; color: #888; font-size: 20px;">✕</a>
    </div>
    {% endfor %}

    {% if cart %}
    <div style="margin-top: 40px;">
        <h2 style="text-align: right; font-size: 28px; margin-bottom: 20px;">Total: ${{ total }}</h2>
        
        <div style="display: flex; justify-content: flex-end; align-items: center; gap: 20px;">
            <a href="/clear_cart" style="background: #f5f5f7; color: #1d1d1f; text-decoration: none; padding: 16px 30px; border-radius: 12px; font-weight: 600; font-size: 16px; transition: all 0.3s ease;"
               onmouseover="this.style.background='#e8e8ed'" 
               onmouseout="this.style.background='#f5f5f7'">
                Clear Bag
            </a>

            <form action="/create-checkout-session" method="POST" style="margin: 0;">
                <button type="submit" style="background: #0071e3; color: white; border: none; padding: 16px 50px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s ease;"
                        onmouseover="this.style.background='#0077ed'" 
                        onmouseout="this.style.background='#0071e3'">
                    Checkout with Stripe
                </button>
            </form>
        </div>
    </div>
    {% else %}
    <div style="text-align: center; padding: 100px 0;">
        <p style="color: #888; font-size: 20px;">Your bag is empty.</p>
        <a href="/shop" style="color: #0071e3; text-decoration: none; font-weight: 600; display: inline-block; margin-top: 20px;">Continue Shopping →</a>
    </div>
    {% endif %}
</div>
{% endblock %}
