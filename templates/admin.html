{% extends "layout.html" %}
{% block content %}
<div style="padding: 50px 5%; max-width: 800px; margin: auto;">
    <h2 style="text-align: center;">Add New Product</h2>
    <form method="POST" enctype="multipart/form-data" style="display: grid; gap: 15px; background: #f9f9f9; padding: 30px; border-radius: 20px;">
        <input type="text" name="name" placeholder="Product Name" required style="padding: 12px; border-radius: 10px; border: 1px solid #ddd;">
        <input type="number" name="price" placeholder="Price" step="0.01" required style="padding: 12px; border-radius: 10px; border: 1px solid #ddd;">
        <select name="category" style="padding: 12px; border-radius: 10px; border: 1px solid #ddd;">
            <option value="Mobile">Mobile</option>
            <option value="iPad">iPad</option>
            <option value="PC">PC</option>
            <option value="Watch">Watch</option>
            <option value="Accessories">Accessories</option>
        </select>
        <textarea name="description" placeholder="Product Description" rows="5" style="padding: 12px; border-radius: 10px; border: 1px solid #ddd;"></textarea>
        <label>Main Image: <input type="file" name="img_main" required></label>
        <label>Gallery (Select multiple): <input type="file" name="img_gallery" multiple></label>
        <button type="submit" style="background: #34c759; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer;">Save Product</button>
    </form>

    <h3 style="margin-top: 50px;">Manage Products</h3>
    <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
        <thead>
            <tr style="background: #eee;">
                <th style="padding: 10px; text-align: left;">Name</th>
                <th style="padding: 10px; text-align: left;">Category</th>
                <th style="padding: 10px; text-align: left;">Price</th>
                <th style="padding: 10px; text-align: left;">Action</th>
            </tr>
        </thead>
        <tbody>
            {% for p in products %}
            <tr style="border-bottom: 1px solid #eee;">
                <td style="padding: 10px;">{{ p.name }}</td>
                <td style="padding: 10px;">{{ p.category }}</td>
                <td style="padding: 10px;">${{ p.price }}</td>
                <td style="padding: 10px;"><a href="/delete/{{ p.id }}" style="color: red;">{{ t.del }}</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <form action="{{ url_for('delete_product', product_id=product.id) }}" method="POST" style="display:inline;">
    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Վստա՞հ եք, որ ուզում եք ջնջել այս ապրանքը։')">
        Ջնջել
    </button>
</form>
</div>
{% endblock %}
