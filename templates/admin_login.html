{% extends "layout.html" %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 80vh; background-color: #f5f5f7; padding: 20px;">
    <div style="background: white; padding: 40px; border-radius: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 400px; width: 100%; text-align: center; border: 1px solid #d2d2d7;">
        
        <div style="font-size: 50px; margin-bottom: 20px; color: #1d1d1f;">🔐</div>
        
        <h2 style="font-family: -apple-system, sans-serif; font-size: 28px; font-weight: 600; color: #1d1d1f; margin-bottom: 10px;">Admin Access</h2>
        <p style="color: #6e6e73; margin-bottom: 30px; font-family: -apple-system, sans-serif;">Please enter your administrative credentials.</p>

        <form action="/admin/login" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
            <input type="text" name="username" placeholder="Admin Username" required 
                   style="padding: 15px; border-radius: 12px; border: 1px solid #d2d2d7; font-size: 16px; outline: none; transition: border-color 0.3s; font-family: -apple-system, sans-serif;">
            
            <input type="password" name="password" placeholder="Admin Password" required 
                   style="padding: 15px; border-radius: 12px; border: 1px solid #d2d2d7; font-size: 16px; outline: none; transition: border-color 0.3s; font-family: -apple-system, sans-serif;">
            
            <button type="submit" 
                    style="padding: 15px; border-radius: 12px; border: none; background-color: #1d1d1f; color: white; font-size: 17px; font-weight: 500; cursor: pointer; transition: background 0.3s; margin-top: 10px; font-family: -apple-system, sans-serif;">
                Access Dashboard
            </button>
        </form>

        <p style="margin-top: 25px; font-family: -apple-system, sans-serif;">
            <a href="/" style="color: #0071e3; text-decoration: none; font-size: 15px;">← Return to Store</a>
        </p>
    </div>
</div>

<style>
    input:focus {
        border-color: #0071e3 !important;
        box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
    }
    button:hover {
        background-color: #000000 !important;
    }
</style>
{% endblock %}
