{% extends "layout.html" %}
{% block content %}

<div style="text-align: center; padding: 100px 5%; background: #000; color: #fff;">
    <h1 style="font-size: 65px; margin: 0; font-weight: 700;">TechPulse</h1>
    <p style="color: #888; font-size: 22px; margin-top: 15px;">Elevating your digital lifestyle.</p>
</div>

<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 35px; padding: 70px 8%;">
    {% for p in products %}
    <div style="position: relative; text-align: center; padding: 40px; border-radius: 25px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.03);">
        <span style="position: absolute; top: 20px; left: 20px; background: #0071e3; color: white; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold;">NEW</span>
        
        <div style="height: 250px; display: flex; align-items: center; justify-content: center;">
            <img src="{{ product.img_main }}" alt="{{ product.name }}"  style="max-width: 100%; max-height: 100%; object-fit: contain;">
        </div>

        <h3 style="margin: 20px 0 10px;">{{ p.name }}</h3>
        <p style="color: #0071e3; font-weight: bold; font-size: 22px; margin-bottom: 15px;">${{ p.price }}</p>
        
        <a href="/product/{{ p.id }}" style="text-decoration: none; color: #0066cc; font-size: 16px; display: block; margin-bottom: 20px;">{{ t.more }} ></a>

        <form action="/add_to_cart" method="POST">
            <input type="hidden" name="name" value="{{ p.name }}">
            <input type="hidden" name="price" value="{{ p.price }}">
            <input type="hidden" name="img" value="{{ p.img_main }}">
            <button type="submit" style="background:#000; color:#fff; border:none; padding:15px; border-radius:15px; width:100%; cursor:pointer; font-weight: bold;">{{ t.add }}</button>
        </form>
    </div>
    {% endfor %}
</div>

<div style="text-align: center; padding-bottom: 80px;">
    <a href="/shop" style="background: #1d1d1f; color: #fff; padding: 15px 40px; border-radius: 30px; text-decoration: none; font-weight: 500;">View All Products</a>
</div>



{% endblock %}
