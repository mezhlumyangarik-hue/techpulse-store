{% extends "layout.html" %}
{% block content %}
<div style="max-width: 400px; margin: 80px auto; padding: 40px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center;">
    <h2>Admin Login</h2>
    <form method="POST">
        <input type="password" name="password" placeholder="Admin Password" style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 20px; outline: none; box-sizing: border-box;">
        <button type="submit" style="width: 100%; background: #000; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer;">Login</button>
    </form>
    <a href="/" style="display: block; margin-top: 20px; color: #888; text-decoration: none;">← Back to Store</a>
</div>
{% endblock %}
