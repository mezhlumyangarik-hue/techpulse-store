{% extends "layout.html" %}
{% block content %}
<div style="padding: 50px 5%; max-width: 1200px; margin: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 50px;">
    
    <div>
        <div style="width: 100%; height: 400px; background: #fdfdfd; border-radius: 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 20px;">
            <img id="main-prod-img" src="{{ product.img_main }}" alt="{{ product.name }}" style="max-width: 100%; max-height: 100%; object-fit: contain;">
        </div>

        {% if gallery %}
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <img src="{{ product.img_main }}" style="width: 70px; height: 70px; object-fit: contain; border: 1px solid #ddd; border-radius: 10px; cursor: pointer;" onclick="changeImage('{{ product.img_main }}')">
            
            {% for img in gallery %}
                {% if img.strip() %}
                <img src="{{ img }}" style="width: 70px; height: 70px; object-fit: contain; border: 1px solid #ddd; border-radius: 10px; cursor: pointer;" onclick="changeImage('{{ img }}')">
                {% endif %}
            {% endfor %}
        </div>
        {% endif %}
    </div>

    <div>
        <h2>{{ product.name }}</h2>
        <h3 style="color: #0071e3; margin: 15px 0;">${{ product.price }}</h3>
        <p style="color: #666; line-height: 1.6;">{{ product.description }}</p>
        
        <form action="{{ url_for('add_to_cart') }}" method="POST" style="margin-top: 30px;">
            <input type="hidden" name="name" value="{{ product.name }}">
            <input type="hidden" name="price" value="{{ product.price }}">
            <input type="hidden" name="img" value="{{ product.img_main }}">
            <button type="submit" style="background: #0071e3; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%;">
                {{ t.add }}
            </button>
        </form>
    </div>

</div>

<script>
function changeImage(imageUrl) {
    // Ուղղակի վերցնում է Cloudinary-ի հղումը և դնում մեծ նկարի տեղը
    document.getElementById('main-prod-img').src = imageUrl;
}
</script>
{% endblock %}
