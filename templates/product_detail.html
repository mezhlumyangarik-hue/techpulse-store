{% extends "layout.html" %}
{% block content %}
<div style="max-width: 1100px; margin: 50px auto; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 50px;">
    <div>
        <img src="{{ product.img_main }}"  style="width: 100%; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
        
        <div style="display: flex; gap: 10px; margin-top: 20px; overflow-x: auto;">
    {% for img in gallery %}
      <img src="{{ img }}" 
             style="width: 80px; height: 80px; object-fit: cover; border-radius: 10px; cursor: pointer; border: 2px solid #eee;"
             onclick="changeImg(this.src)">
    {% endfor %}
</div>
    </div>

    <div style="padding-top: 20px;">
        <h1 style="font-size: 42px; margin: 0;">{{ product.name }}</h1>
        <p style="color: #0071e3; font-size: 28px; font-weight: bold; margin: 15px 0;">${{ product.price }}</p>
        <hr style="border: 0; border-top: 1px solid #d2d2d7; margin: 20px 0;">
        <p style="color: #555; line-height: 1.6; font-size: 17px;">{{ product.description }}</p>
        
        <form action="/add_to_cart" method="POST" style="margin-top: 30px;">
            <input type="hidden" name="name" value="{{ product.name }}">
            <input type="hidden" name="price" value="{{ product.price }}">
            <input type="hidden" name="img" value="{{ product.img_main }}">
            <button type="submit" style="background: #0071e3; color: white; border: none; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%;">
                {{ t.add }}
            </button>
        </form>
    </div>
</div>
<script>
function changeImg(src) {
    const main = document.getElementById('mainImg');
    main.style.transition = 'opacity 0.2s ease-in-out';
    main.style.opacity = '0.5';
    setTimeout(() => {
        main.src = src;
        main.style.opacity = '1';
    }, 200);
}
</script>
{% endblock %}
