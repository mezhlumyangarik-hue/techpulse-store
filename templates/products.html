{% extends "layout.html" %}
{% block content %}
<div style="max-width: 1100px; margin: 50px auto; display: flex; gap: 50px; padding: 20px;">
    <div style="flex: 1;">
        <img id="mainImg" src="/static/uploads/{{ product.img_main }}" style="width: 100%; border-radius: 20px;">
    </div>
    <div style="flex: 1;">
        <h1>{{ product.name }}</h1>
        <p style="color: #888;">{{ product.category }}</p>
        <h2 style="color: #0071e3;">${{ product.price }}</h2>
        <p>{{ product.description }}</p>

        <form action="/add_to_cart" method="POST" style="margin-top: 30px;">
            <input type="hidden" name="name" value="{{ product.name }}">
            <input type="hidden" name="price" value="{{ product.price }}">
            <input type="hidden" name="img" value="{{ product.img_main }}">
            <button type="submit" style="background: #0071e3; color: white; border: none; padding: 15px 40px; border-radius: 12px; font-size: 18px; cursor: pointer; width: 100%;">
                {{ t.add }}
            </button>
        </form>
    </div>
</div>
{% endblock %}
